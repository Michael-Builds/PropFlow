<app-page-header [eyebrow]="config.eyebrow" [title]="config.title" [description]="config.description">
  <app-button variant="secondary" icon="refresh" label="Refresh" (pressed)="refresh()" />
  @if (canGenerate()) {
    <app-button variant="secondary" icon="file" label="Generate agreement" (pressed)="openGenerate()" />
  }
  @if (config.canCreate) {
    <app-button icon="plus" [label]="config.createLabel" (pressed)="openCreate()" />
  }
</app-page-header>

<app-data-table
  [columns]="columns"
  [data]="rows()"
  [filters]="filters"
  [loading]="loading()"
  [selectable]="config.canDelete"
  [exportFileName]="config.exportFileName"
  [exportTitle]="config.title"
  (rowClick)="openDetail($event)"
  (rowAction)="onRowAction($event)"
  (bulkDelete)="onBulkDelete($event)"
/>

@if (dialogOpen()) {
  <app-form-dialog
    [title]="editing() ? 'Edit record' : config.createLabel"
    [description]="config.description"
    [saving]="saving()"
    (closed)="closeDialog()"
    (saved)="save()"
  >
    <form class="grid gap-4 sm:grid-cols-2" [formGroup]="form">
      @for (field of fields; track field.key) {
        <div [class.sm:col-span-2]="field.type === 'textarea'">
          @if (field.type === 'select') {
            <app-select
              [label]="field.label"
              [options]="optionsFor(field)"
              [searchable]="isSearchable(field)"
              [formControlName]="field.key"
            />
          } @else if (field.type === 'textarea') {
            <app-textarea
              [label]="field.label"
              [placeholder]="field.placeholder ?? ''"
              [rows]="field.rows ?? 4"
              [formControlName]="field.key"
            />
          } @else {
            <app-input
              [label]="field.label"
              [type]="field.type"
              [placeholder]="field.placeholder ?? ''"
              [formControlName]="field.key"
            />
          }
        </div>
      }
    </form>
  </app-form-dialog>
}

@if (generateOpen()) {
  <app-generate-agreement-dialog
    [prefillTemplateId]="generateTemplateId()"
    [prefillLeaseId]="generateLeaseId()"
    [prefillTenantId]="generateTenantId()"
    [prefillUnitId]="generateUnitId()"
    (closed)="closeGenerate()"
    (saved)="onAgreementSaved()"
  />
}
