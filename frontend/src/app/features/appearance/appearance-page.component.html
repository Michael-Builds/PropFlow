<app-page-header
  eyebrow="Workspace"
  title="Appearance"
  description="Choose an operator palette. Each card is a live preview of chrome, cards, and controls. The selection is saved in this browser."
/>

<div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
  @for (theme of themes.themes; track theme.id) {
    <button
      type="button"
      class="group appearance-card rounded-2xl border bg-card p-4 text-left transition hover:-translate-y-0.5 hover:border-brand/40 md:cursor-pointer sm:p-5"
      [attr.data-theme]="theme.id"
      [class.border-brand]="isActive(theme.id)"
      [class.ring-2]="isActive(theme.id)"
      [class.ring-brand]="isActive(theme.id)"
      (click)="apply(theme.id)"
    >
      <span
        class="mb-4 flex h-36 overflow-hidden rounded-xl border border-border shadow-none sm:h-40"
      >
        <span class="flex w-[30%] flex-col gap-2 bg-sidebar p-2.5 text-white">
          <span class="flex items-center gap-1.5">
            <app-logo [size]="20" />
            <span class="h-1.5 w-10 rounded-full bg-white/35"></span>
          </span>
          <span class="mt-1 space-y-1.5">
            <span class="flex h-5 items-center rounded-md bg-white/15 px-1.5">
              <span class="h-1 w-8 rounded-full bg-white/70"></span>
            </span>
            <span class="flex h-5 items-center rounded-md px-1.5">
              <span class="h-1 w-7 rounded-full bg-white/30"></span>
            </span>
            <span class="flex h-5 items-center rounded-md px-1.5">
              <span class="h-1 w-9 rounded-full bg-white/25"></span>
            </span>
          </span>
        </span>
        <span class="flex min-w-0 flex-1 flex-col bg-surface">
          <span class="flex h-7 items-center justify-between border-b border-border bg-white px-2">
            <span class="h-1.5 w-16 rounded-full bg-text-muted/30"></span>
            <span class="flex gap-1">
              <span class="size-3 rounded-full border border-border"></span>
              <span class="size-3 rounded-full bg-brand-soft"></span>
            </span>
          </span>
          <span class="grid flex-1 grid-cols-3 gap-1.5 p-2">
            <span class="rounded-md border border-border bg-card p-1.5">
              <span class="mb-1.5 block h-1 w-8 rounded-full bg-text-muted/40"></span>
              <span class="block h-3 rounded-sm bg-brand-soft"></span>
            </span>
            <span class="rounded-md border border-border bg-card p-1.5">
              <span class="mb-1.5 block h-1 w-7 rounded-full bg-text-muted/40"></span>
              <span class="block h-3 rounded-sm bg-brand/20"></span>
            </span>
            <span class="rounded-md border border-border bg-card p-1.5">
              <span class="mb-1.5 block h-1 w-6 rounded-full bg-text-muted/40"></span>
              <span class="block h-3 rounded-sm bg-navy/20"></span>
            </span>
            <span class="col-span-3 flex items-end justify-between rounded-md border border-border bg-card px-2 py-1.5">
              <span class="space-y-1">
                <span class="block h-1 w-16 rounded-full bg-text-muted/30"></span>
                <span class="block h-1 w-10 rounded-full bg-text-muted/20"></span>
              </span>
              <span class="h-4 w-10 rounded-md bg-brand"></span>
            </span>
          </span>
        </span>
      </span>

      <span class="mb-3 flex gap-1.5">
        <span class="size-4 rounded-full border border-border" [style.background]="theme.navy"></span>
        <span class="size-4 rounded-full border border-border" [style.background]="theme.swatch"></span>
        <span class="size-4 rounded-full border border-border" [style.background]="theme.accent"></span>
      </span>

      <span class="flex items-start justify-between gap-3">
        <span>
          <span class="block font-semibold text-text-primary">{{ theme.name }}</span>
          <span class="mt-1 block text-sm text-text-secondary">{{ theme.description }}</span>
        </span>
        @if (isActive(theme.id)) {
          <span class="inline-flex items-center gap-1 rounded-full bg-brand-soft px-2 py-0.5 text-[11px] font-semibold text-brand">
            <app-icon name="check" [size]="12" />
            Active
          </span>
        }
      </span>
    </button>
  }
</div>
