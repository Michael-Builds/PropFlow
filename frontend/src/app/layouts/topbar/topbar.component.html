<header class="relative z-30 border-b border-border/80 bg-white">
  <div class="flex items-center justify-between gap-2 px-3 py-3 sm:gap-4 sm:px-6 sm:py-3.5">
    <div class="flex min-w-0 items-center gap-2 sm:gap-3">
      <button
        type="button"
        class="inline-flex size-10 shrink-0 items-center justify-center rounded-md border border-border text-text-secondary transition hover:bg-surface md:cursor-pointer lg:hidden"
        (click)="sidebar.toggleMobile()"
        aria-label="Open navigation"
      >
        <app-icon name="menu" [size]="18" />
      </button>
      <button
        type="button"
        class="hidden size-10 shrink-0 items-center justify-center rounded-md border border-border text-text-secondary transition hover:bg-surface md:cursor-pointer lg:inline-flex"
        (click)="sidebar.toggleCollapsed()"
        aria-label="Collapse navigation"
      >
        <app-icon name="menu" [size]="18" />
      </button>
      <div class="min-w-0">
        <h2 class="truncate text-sm font-semibold text-text-primary sm:text-base">{{ auth.displayName() }}</h2>
        <p class="hidden truncate text-xs text-text-secondary sm:block">{{ auth.roleLabel() }} · org_001</p>
      </div>
    </div>
    <div class="flex shrink-0 items-center gap-1.5 sm:gap-2">
      <div class="relative hidden min-w-0 items-center lg:flex">
        <app-icon name="search" [size]="16" class="pointer-events-none absolute left-3 text-text-muted" />
        <input
          type="search"
          placeholder="Search properties, tenants, tickets..."
          class="h-10 w-56 rounded-md border border-border bg-surface/70 pr-3 pl-9 text-sm outline-none transition placeholder:text-text-muted focus:border-brand focus:bg-white xl:w-72"
        />
      </div>
      <div class="relative" (mousedown)="$event.stopPropagation()">
        <button
          type="button"
          class="relative inline-flex size-10 items-center justify-center rounded-xl border border-border text-text-secondary transition hover:bg-surface md:cursor-pointer"
          aria-label="Notifications"
          (click)="toggleNotifications()"
        >
          <app-icon name="bell" [size]="18" />
          @if (notifications.unreadCount() > 0) {
            <span class="absolute -top-1 -right-1 inline-flex min-w-5 items-center justify-center rounded-full bg-danger px-1 text-[10px] font-bold text-white ring-2 ring-white">
              {{ notifications.unreadCount() }}
            </span>
          }
        </button>
        @if (notifOpen()) {
          <div class="absolute right-0 z-50 mt-2 w-[min(calc(100vw-1.5rem),22rem)] overflow-hidden rounded-2xl border border-border bg-white shadow-(--shadow-elevated)">
            <div class="flex items-center justify-between border-b border-border-light px-4 py-3">
              <div>
                <p class="text-sm font-semibold">Notifications</p>
                <p class="text-xs text-text-muted">{{ notifications.unreadCount() }} unread</p>
              </div>
              <button type="button" class="text-xs font-semibold text-brand md:cursor-pointer" (click)="markAllRead()">
                Mark all read
              </button>
            </div>
            <ul class="app-scrollbar max-h-[min(20rem,50dvh)] overflow-y-auto">
              @for (item of notifications.recentItems(); track item.id) {
                <li class="border-b border-border-light px-4 py-3 last:border-0">
                  <p class="text-sm font-medium">{{ item.title }}</p>
                  <p class="mt-0.5 text-xs text-text-secondary">{{ item.message }}</p>
                </li>
              }
            </ul>
            <a routerLink="/notifications" class="block border-t border-border-light px-4 py-3 text-center text-xs font-semibold text-brand" (click)="notifOpen.set(false)">
              View all
            </a>
          </div>
        }
      </div>
      <a
        routerLink="/appearance"
        class="inline-flex size-10 items-center justify-center rounded-xl border border-border text-text-secondary transition hover:bg-surface md:cursor-pointer"
        title="Color scheme"
      >
        <app-icon name="palette" [size]="18" />
      </a>
    </div>
  </div>
</header>
