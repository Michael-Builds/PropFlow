@if (notes().length === 0) {
  <p class="text-sm text-text-muted">{{ emptyLabel() }}</p>
} @else {
  <ul class="space-y-3">
    @for (note of notes(); track note.id) {
      <li class="rounded-md bg-surface px-3 py-2.5">
        <p class="text-sm leading-relaxed text-text-primary">{{ note.body }}</p>
        <p class="mt-1.5 text-xs text-text-muted">{{ note.author }} · {{ formatAt(note.at) }}</p>
      </li>
    }
  </ul>
}
