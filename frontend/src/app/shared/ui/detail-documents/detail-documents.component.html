@if (documents().length === 0) {
  <p class="text-sm text-text-muted">{{ emptyLabel() }}</p>
} @else {
  <div class="overflow-x-auto">
    <table class="w-full min-w-[36rem] text-left text-sm">
      <thead>
        <tr class="border-b border-border-light text-[11px] font-semibold tracking-wide text-text-muted uppercase">
          <th class="pr-4 pb-2.5 font-semibold">Document</th>
          <th class="pr-4 pb-2.5 font-semibold">Type</th>
          <th class="pr-4 pb-2.5 font-semibold">Status</th>
          <th class="pb-2.5 font-semibold">Uploaded</th>
        </tr>
      </thead>
      <tbody>
        @for (doc of documents(); track doc.id) {
          <tr class="border-b border-border-light/70 last:border-0">
            <td class="py-3 pr-4 font-medium text-text-primary">{{ doc.name }}</td>
            <td class="py-3 pr-4 text-text-secondary">{{ doc.type }}</td>
            <td class="py-3 pr-4">
              <app-badge [variant]="statusVariant(doc.status)" [label]="doc.status" />
            </td>
            <td class="py-3 text-text-muted tabular-nums">{{ doc.uploadedAt | date: 'mediumDate' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
