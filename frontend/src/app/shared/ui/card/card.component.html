<section
  class="flex h-full min-w-0 max-w-full flex-col overflow-hidden rounded-md border border-border bg-card shadow-none"
  [class.p-0]="flush()"
  [class.p-4]="!flush()"
  [class.sm:p-5]="!flush()"
>
  @if (title() || subtitle()) {
    <header
      class="mb-3 flex shrink-0 items-start justify-between gap-3 border-b border-border-light pb-3 sm:mb-4 sm:pb-3.5"
    >
      <div class="min-w-0">
        @if (title()) {
          <h3 class="text-[0.95rem] font-semibold text-text-primary md:text-base">{{ title() }}</h3>
        }
        @if (subtitle()) {
          <p class="mt-1 text-sm leading-relaxed text-text-secondary">{{ subtitle() }}</p>
        }
      </div>
      <div class="shrink-0">
        <ng-content select="[card-actions]" />
      </div>
    </header>
  }
  <div class="flex min-h-0 min-w-0 max-w-full flex-1 flex-col overflow-hidden">
    <ng-content />
  </div>
</section>
