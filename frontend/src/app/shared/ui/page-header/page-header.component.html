<div class="mb-4 flex flex-col gap-3 sm:mb-2 sm:flex-row sm:items-start sm:justify-between sm:gap-4">
  <div class="min-w-0 max-w-3xl">
    @if (eyebrow()) {
      <p class="mb-1.5 text-[11px] font-semibold tracking-[0.14em] text-brand uppercase">
        {{ eyebrow() }}
      </p>
    }
    <h1
      class="text-xl leading-tight font-semibold tracking-tight text-text-primary sm:text-2xl md:text-[1.85rem]"
    >
      {{ title() }}
    </h1>
    @if (description()) {
      <p class="mt-1.5 text-sm leading-relaxed text-text-secondary md:text-[0.95rem]">
        {{ description() }}
      </p>
    }
  </div>
  <div class="flex w-full shrink-0 flex-wrap items-center gap-2 sm:w-auto sm:justify-end">
    <ng-content />
  </div>
</div>
