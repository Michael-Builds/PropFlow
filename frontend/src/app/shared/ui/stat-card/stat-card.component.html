<article
  class="rounded-lg border border-border bg-card p-5 shadow-none transition hover:border-brand/30"
>
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-sm font-medium text-text-secondary">{{ label() }}</p>
      <p class="mt-2 text-2xl font-semibold tracking-tight text-text-primary md:text-3xl">
        {{ value() }}
      </p>
      @if (hint()) {
        <p class="mt-2 text-xs leading-snug font-medium text-brand md:text-sm">{{ hint() }}</p>
      }
    </div>
    <div class="flex size-10 shrink-0 items-center justify-center rounded-md bg-brand-soft text-brand">
      <app-icon [name]="icon()" [size]="18" />
    </div>
  </div>
</article>
