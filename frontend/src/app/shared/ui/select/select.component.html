<div #root class="relative flex w-full flex-col gap-1.5">
  @if (label()) {
    <span class="text-sm font-medium text-text-primary md:text-base">{{ label() }}</span>
  }

  <button
    #trigger
    type="button"
    [class]="triggerClass"
    [attr.aria-expanded]="open()"
    [attr.aria-haspopup]="'listbox'"
    [disabled]="isDisabled()"
    (click)="toggle()"
  >
    <span class="flex min-w-0 items-center gap-1 overflow-hidden">
      @if (leadingLabel()) {
        <span class="shrink-0 text-text-muted">{{ leadingLabel() }}:</span>
      }
      <span class="truncate" [class.text-text-muted]="!selectedLabel()">
        {{ selectedLabel() || placeholder() }}
      </span>
    </span>
    <app-icon
      name="chevron"
      [size]="16"
      class="shrink-0 text-text-muted transition-transform"
      [class.rotate-180]="open()"
    />
  </button>

  @if (open()) {
    <div
      #menu
      class="fixed z-10050 overflow-hidden rounded-md border border-border bg-white shadow-(--shadow-elevated)"
      [ngStyle]="menuStyle()"
      role="listbox"
    >
      @if (searchable()) {
        <div class="border-b border-border-light p-2">
          <div class="relative">
            <app-icon
              name="search"
              [size]="14"
              class="pointer-events-none absolute top-1/2 left-2.5 -translate-y-1/2 text-text-muted"
            />
            <input
              type="search"
              class="h-9 w-full rounded-md border border-border bg-surface/50 pr-3 pl-8 text-sm outline-none focus:border-brand focus:bg-white"
              placeholder="Search..."
              [value]="search()"
              (input)="onSearch($event)"
              (click)="$event.stopPropagation()"
            />
          </div>
        </div>
      }

      <div class="app-scrollbar max-h-56 overflow-y-auto py-1">
        @for (option of filteredOptions(); track option.value) {
          <button
            type="button"
            role="option"
            class="flex w-full md:cursor-pointer items-center justify-between gap-3 px-3.5 py-2.5 text-left text-sm transition hover:bg-brand-muted"
            [class.bg-brand-soft]="value() === option.value"
            [class.text-brand]="value() === option.value"
            [class.text-text-primary]="value() !== option.value"
            [attr.aria-selected]="value() === option.value"
            (click)="select(option)"
          >
            <span class="whitespace-nowrap">{{ option.label }}</span>
            @if (value() === option.value) {
              <app-icon name="check" [size]="15" class="shrink-0 text-brand" />
            }
          </button>
        } @empty {
          <p class="px-3.5 py-3 text-sm text-text-muted">{{ emptyLabel() }}</p>
        }
      </div>
    </div>
  }

  @if (hint()) {
    <span class="text-xs text-text-muted md:text-sm">{{ hint() }}</span>
  }
</div>
