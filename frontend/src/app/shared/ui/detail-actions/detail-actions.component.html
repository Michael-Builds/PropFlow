<div class="space-y-2">
  @for (action of actions(); track action.path + action.label) {
    <a [routerLink]="action.path" class="block md:cursor-pointer">
      <app-button
        class="flex! w-full!"
        [variant]="action.variant"
        [icon]="action.icon"
        [label]="action.label"
      />
    </a>
  }
</div>
