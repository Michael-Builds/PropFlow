<button
  type="button"
  class="absolute inset-0 bg-navy-deep/45 backdrop-blur-[2px]"
  aria-label="Close dialog backdrop"
  (click)="onBackdrop()"
></button>

<div
  class="app-modal relative flex max-h-[min(92dvh,40rem)] w-full flex-col overflow-hidden rounded-t-2xl border border-border bg-white shadow-none sm:rounded-md"
  [class.max-w-lg]="size() === 'sm'"
  [class.max-w-2xl]="size() === 'md'"
  [class.max-w-3xl]="size() === 'lg'"
  role="dialog"
  aria-modal="true"
  (click)="$event.stopPropagation()"
>
  <div
    class="flex shrink-0 items-start justify-between gap-3 border-b border-border-light px-4 py-4 sm:px-5"
  >
    <div class="min-w-0">
      <h2 class="text-base font-semibold text-text-primary sm:text-lg">{{ title() }}</h2>
      @if (description()) {
        <p class="mt-1 text-sm text-text-secondary">{{ description() }}</p>
      }
    </div>
    <app-button
      type="button"
      variant="ghost"
      size="sm"
      icon="close"
      ariaLabel="Close dialog"
      (pressed)="closed.emit()"
    />
  </div>

  <div class="app-scrollbar min-h-0 flex-1 overflow-y-auto px-4 py-4 sm:px-5">
    <ng-content />
  </div>

  <div
    class="flex shrink-0 flex-col-reverse gap-2 border-t border-border-light px-4 py-4 sm:flex-row sm:justify-end sm:px-5 *:w-full sm:*:w-auto"
  >
    <app-button
      type="button"
      variant="secondary"
      [label]="cancelLabel()"
      (pressed)="closed.emit()"
    />
    <app-button
      type="button"
      icon="check"
      [label]="saveLabel()"
      [loading]="saving()"
      (pressed)="saved.emit()"
    />
  </div>
</div>
