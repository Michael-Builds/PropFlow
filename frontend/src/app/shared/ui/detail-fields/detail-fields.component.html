<dl class="grid grid-cols-2 gap-x-5 gap-y-3 sm:grid-cols-3">
  @for (field of fields(); track field.label) {
    <div class="min-w-0">
      <dt class="text-[11px] font-semibold tracking-wide text-text-muted uppercase">
        {{ field.label }}
      </dt>
      <dd class="mt-1">
        @if (field.kind === 'badge') {
          <app-badge [variant]="field.variant" [label]="field.value" />
        } @else {
          <span
            class="text-sm break-words text-text-primary"
            [class.font-medium]="field.emphasis"
            [class.tabular-nums]="field.tabular"
          >
            {{ field.value }}
          </span>
        }
      </dd>
    </div>
  }
</dl>
