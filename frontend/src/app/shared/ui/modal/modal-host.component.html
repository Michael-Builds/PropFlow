@for (modal of modalService.modals(); track modal.id) {
  <div class="fixed inset-0 z-9990 flex items-end justify-center p-3 sm:items-center sm:p-4">
    <button
      type="button"
      class="absolute inset-0 bg-navy-deep/45 backdrop-blur-[2px]"
      aria-label="Close modal backdrop"
      (click)="modal.dismissible && modalService.close(modal.id, false)"
    ></button>

    <div
      role="dialog"
      aria-modal="true"
      class="app-modal relative flex max-h-[min(92dvh,40rem)] w-full flex-col overflow-hidden rounded-t-2xl border border-border bg-white shadow-none sm:rounded-md"
      [class.max-w-lg]="modal.size === 'sm'"
      [class.max-w-2xl]="modal.size === 'md'"
      [class.max-w-3xl]="modal.size === 'lg'"
      [class.max-w-4xl]="modal.size === 'xl'"
    >
      @if (modal.title) {
        <header
          class="flex shrink-0 items-center justify-between gap-3 border-b border-border-light px-4 py-4 sm:px-5"
        >
          <h2 class="text-base font-semibold text-text-primary sm:text-lg">{{ modal.title }}</h2>
          @if (modal.dismissible) {
            <app-button
              variant="ghost"
              size="sm"
              icon="close"
              ariaLabel="Close modal"
              (pressed)="modalService.close(modal.id, false)"
            />
          }
        </header>
      }

      <div class="min-h-0 overflow-y-auto p-4 app-scrollbar sm:p-5">
        @if (isConfirm(modal.data); as confirm) {
          <div class="flex flex-col gap-4">
            <div
              class="flex items-start gap-3 rounded-md border p-3.5"
              [class.border-danger/20]="confirm.variant === 'danger'"
              [class.bg-danger-soft]="confirm.variant === 'danger'"
              [class.border-warning/20]="confirm.variant === 'warning'"
              [class.bg-warning-soft]="confirm.variant === 'warning'"
              [class.border-border]="!confirm.variant || confirm.variant === 'default'"
              [class.bg-surface]="!confirm.variant || confirm.variant === 'default'"
            >
              <app-icon
                [name]="confirm.variant === 'danger' ? 'error' : confirm.variant === 'warning' ? 'warning' : 'info'"
                [size]="20"
                [class.text-danger]="confirm.variant === 'danger'"
                [class.text-warning]="confirm.variant === 'warning'"
                [class.text-brand]="!confirm.variant || confirm.variant === 'default'"
              />
              <p class="text-sm text-text-secondary">{{ confirm.message }}</p>
            </div>

    <div
      class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end [&>*]:w-full sm:[&>*]:w-auto"
    >
      <app-button
        variant="secondary"
        [label]="confirm.cancelLabel || 'Cancel'"
        (pressed)="modalService.close(modal.id, false)"
      />
      <app-button
        [variant]="confirm.variant === 'danger' ? 'danger' : 'primary'"
        [label]="confirm.confirmLabel || 'Confirm'"
        (pressed)="modalService.close(modal.id, true)"
      />
    </div>
          </div>
        } @else {
          <ng-content />
          <p class="text-sm text-text-secondary">
            Modal content host is ready for feature dialogs.
          </p>
        }
      </div>
    </div>
  </div>
}
